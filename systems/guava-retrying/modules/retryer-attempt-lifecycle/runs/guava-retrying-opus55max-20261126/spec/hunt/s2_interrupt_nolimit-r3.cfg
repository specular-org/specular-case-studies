\* Scenario 2 — caller interrupts without a time limiter (brief MC-4; D-6).  The
\* callable runs on the caller thread (AttemptTimeLimiters.java:77-78); IntrRet /
\* IntrBlock model interruptible blocking calls that throw InterruptedException and
\* clear the status.  retryIfException(), stopAfterAttempt(2), noWait or a positive
\* wait, one interrupt at any step.
\* Expected: NoRetryAfterObservedInterrupt, InterruptPreserved.

