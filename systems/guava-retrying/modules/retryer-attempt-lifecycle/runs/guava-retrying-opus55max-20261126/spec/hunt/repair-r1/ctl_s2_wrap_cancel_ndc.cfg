\* ctl_s2_wrap_cancel_ndc.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s2_wrap_cancel.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: current-violation check -- the caller-interrupt part of NoDiscardedCompletion was never hunted here (the timeout part fired first and the property was then disabled).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2, w3}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "Never"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Exc", "IntrRet"}
    WrapCallers = {c1}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 1
    MaxTimeouts = 1
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    NoDiscardedCompletion

CHECK_DEADLOCK FALSE
