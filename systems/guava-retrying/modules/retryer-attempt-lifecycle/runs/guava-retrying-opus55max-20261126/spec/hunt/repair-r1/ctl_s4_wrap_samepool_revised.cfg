\* ctl_s4_wrap_samepool_revised.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s4_wrap_samepool.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: acceptance -- as above for wrap() on the limiter's own pool (expected: exhaustive, no violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Fixed"
    PoolSize = 1
    QueueCap = 0
    RetryOn = {"Timeout", "Rejected", "CallableExc"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Ret"}
    WrapCallers = {c1}
    WrapOnLimiterPool = {c1}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 3
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    NoDiscardedCompletion
    CountedImpliesInvokedNoStartRace

CHECK_DEADLOCK FALSE
