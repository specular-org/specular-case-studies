\* MC_hunt_s2_wrap_cancel.cfg
\* Scenario 2 — wrap() task cancelled by its executor (brief MC-5; D-7).  The caller
\* is executor.submit(retryer.wrap(callable)); the outer future is cancelled with
\* cancel(true) (or the executor shutdownNow()'ed) once, at any point.
\* fixedTimeLimit on a cached pool, retryIfException(), neverStop (MaxAttempts = 3).
\* Expected: CancelledWrapperStops (new attempts after the cancellation),
\* NoRetryAfterObservedInterrupt.

SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2, w3}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "Never"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Exc", "IntrRet"}
    WrapCallers = {c1}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 1
    MaxTimeouts = 1
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    \* --- type and structure ---
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    \* --- baseline, expected to hold (MC-8, MC-9) ---
    InterruptContainment
    RetryAccounting
    \* --- scenario properties ---
    SequentialAttempts
    NoActivityAfterOutcome
    NoDiscardedCompletion
    \* CountedImpliesInvoked    \* off: first violated by the timing-only start race (deadline before an idle/new thread reaches the task); CountedImpliesInvokedNoStartRace hunts the rest
    \* CountedImpliesInvokedNoStartRace    \* off: D-5 0-invocation (attempt cancelled before it ran), reported by MC_hunt_s2_interrupt_fixed.cfg
    ExecutionExceptionMeansCallableThrew
    \* ExecutionExceptionMeansCallableThrewExcept29    \* off: superseded here by ExecutionExceptionMeansCallableThrew (#29 cannot trigger: Timeout is retried)
    InterruptPreserved
