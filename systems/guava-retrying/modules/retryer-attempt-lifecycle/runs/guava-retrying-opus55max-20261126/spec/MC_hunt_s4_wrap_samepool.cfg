\* MC_hunt_s4_wrap_samepool.cfg
\* Scenario 1/4 — wrap() tasks on the limiter's own executor (brief MC-3; D-4).
\* The caller is executor.submit(retryer.wrap(callable)) on the same fixed pool of
\* one thread that fixedTimeLimit(d, unit, executor) uses: the RetryerCallable holds
\* the only thread, every attempt waits in the queue and times out unrun.
\* retryIfRuntimeException(), stopAfterAttempt(3) (with neverStop the call would
\* livelock; stopping lets the thread return to the pool and discard the cancelled
\* queued tasks).
\* Before RR-002 the first counterexample was CountedImpliesInvokedNoStartRace
\* (queued timeouts counted as attempts).  RR-002 (MC-8) found that to be the
\* documented behavior of a thread-limited limiter executor, so that property and
\* NoDiscardedCompletion (RR-001) are off here; the cfg still hunts the other
\* scenario properties.

SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Fixed"
    PoolSize = 1
    QueueCap = 0
    RetryOn = {"Timeout", "Rejected", "CallableExc"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Ret"}
    WrapCallers = {c1}
    WrapOnLimiterPool = {c1}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 3
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    \* --- type and structure ---
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    \* --- baseline, expected to hold (MC-8, MC-9) ---
    InterruptContainment
    RetryAccounting
    \* --- scenario properties ---
    SequentialAttempts
    NoActivityAfterOutcome
    \* NoDiscardedCompletion    \* off (RR-001): only its caller-interrupt part is a promised property, and this cfg has no caller interrupt (MaxInterrupts = 0, no outer cancel); the timeout part was removed from base.tla
    \* CountedImpliesInvoked    \* off: first violated by the timing-only start race (deadline before an idle/new thread reaches the task); CountedImpliesInvokedNoStartRace hunts the rest
    \* CountedImpliesInvokedNoStartRace    \* off (RR-002): every never-run attempt here is a timeout of a task queued behind the RetryerCallable, which the revised invariant accepts (Guava SimpleTimeLimiter.java:56-58); its remaining cases need a caller interrupt or a shut-down executor, which this cfg does not have
    ExecutionExceptionMeansCallableThrew
    \* ExecutionExceptionMeansCallableThrewExcept29    \* off: superseded here by ExecutionExceptionMeansCallableThrew (#29 cannot trigger: Timeout is retried)
    InterruptPreserved
    NoRetryAfterObservedInterrupt
    CancelledWrapperStops
    DocumentedOutcomesOnly
    NoLostAttemptOutcome
    ListenersFixedAtBuild

CHECK_DEADLOCK FALSE
