\* ctl_s2_interrupt_fixed_ndc.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s2_interrupt_fixed.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: falsifiability -- the revised NoDiscardedCompletion still flags a completion discarded by the caller-interrupt path (MC-4 scenario F) (expected: violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2}
    TaskIds = {t1, t2}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 2
    SleepClasses = {"Zero", "Positive"}
    Modes = {"Ret", "Exc", "Stuck"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 1
    MaxOuterCancels = 0
    MaxTimeouts = 0
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 2
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    NoDiscardedCompletion

CHECK_DEADLOCK FALSE
