\* MC_hunt_s4_executor.cfg
\* Scenarios 1 and 4 — executor saturation (brief MC-3; D-4).  Two callers share
\* one Retryer whose fixedTimeLimit(d, unit, executor) uses a bounded
\* ThreadPoolExecutor (1 thread, ArrayBlockingQueue(1), AbortPolicy).
\* retryIfRuntimeException(), stopAfterAttempt(2).  A Stuck or slow attempt of either
\* caller pins the only thread (its own zombie, or the other caller's attempt), so
\* later attempts time out in the queue or are rejected without ever running.
\* Before RR-002 the first counterexample was CountedImpliesInvokedNoStartRace (a
\* queued timeout or a rejection counted as an attempt).  RR-002 (MC-8) found both
\* to be the documented behavior of a bounded limiter executor, so that property
\* and NoDiscardedCompletion (RR-001) are off here; the cfg still hunts the other
\* scenario properties under executor saturation.

SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1, c2}
    Workers = {w1}
    TaskIds = {t1, t2, t3, t4}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Bounded"
    PoolSize = 1
    QueueCap = 1
    RetryOn = {"Timeout", "Rejected", "CallableExc"}
    StopKind = "AfterAttempt"
    StopAfter = 2
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Stuck"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 2
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 2
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    \* --- type and structure ---
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    \* --- baseline, expected to hold (MC-8, MC-9) ---
    InterruptContainment
    RetryAccounting
    \* --- scenario properties ---
    SequentialAttempts
    NoActivityAfterOutcome
    \* NoDiscardedCompletion    \* off (RR-001): only its caller-interrupt part is a promised property, and this cfg has no caller interrupt (MaxInterrupts = 0, no outer cancel); the timeout part was removed from base.tla
    \* CountedImpliesInvoked    \* off: first violated by the timing-only start race (deadline before an idle/new thread reaches the task); CountedImpliesInvokedNoStartRace hunts the rest
    \* CountedImpliesInvokedNoStartRace    \* off (RR-002): every never-run attempt here is a timeout or a capacity rejection of a running bounded pool, which the revised invariant accepts (Guava SimpleTimeLimiter.java:56-58); its remaining cases need a caller interrupt or a shut-down executor, which this cfg does not have
    ExecutionExceptionMeansCallableThrew
    \* ExecutionExceptionMeansCallableThrewExcept29    \* off: superseded here by ExecutionExceptionMeansCallableThrew (#29 cannot trigger: Timeout is retried)
    InterruptPreserved
    NoRetryAfterObservedInterrupt
    CancelledWrapperStops
    DocumentedOutcomesOnly
    NoLostAttemptOutcome
    ListenersFixedAtBuild

CHECK_DEADLOCK FALSE
