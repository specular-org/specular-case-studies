\* Trace.cfg — replay one recorded execution (../traces/<name>.ndjson, or the
\* file named by the JSON environment variable) against base.tla.
\* All configuration constants come from the recording's {"tag":"config"} line.

SPECIFICATION TraceSpec

CONSTANTS
    Callers <- TraceCallers
    Workers <- TraceWorkers
    TaskIds <- TraceTaskIds
    NumInitListeners <- TraceNumInitListeners
    NumExtraListeners <- TraceNumExtraListeners
    Limiter <- TraceLimiter
    ExecKind <- TraceExecKind
    PoolSize <- TracePoolSize
    QueueCap <- TraceQueueCap
    RetryOn <- TraceRetryOn
    StopKind <- TraceStopKind
    StopAfter <- TraceStopAfter
    SleepClasses <- TraceSleepClasses
    Modes <- TraceModes
    WrapCallers <- TraceWrapCallers
    WrapOnLimiterPool <- TraceWrapOnLimiterPool
    NoTask = "NoTask"
    NoWorker = "NoWorker"
    NoCaller = "NoCaller"

\* The recording must be consumed completely.
PROPERTIES
    TraceMatched

\* Checked on every replayed state: type and structure, and the baseline
\* properties that hold on every real execution (MC-8, MC-9).  The scenario
\* properties are not checked here: real executions violate them whenever a
\* defect is exercised (e.g. a timed-out attempt still running), which is
\* what MC_hunt_*.cfg looks for; ModelBoundsAdequate is an MC-only alarm.
INVARIANTS
    TypeOK
    StructuralOK
    InterruptContainment
    RetryAccounting

CHECK_DEADLOCK FALSE
