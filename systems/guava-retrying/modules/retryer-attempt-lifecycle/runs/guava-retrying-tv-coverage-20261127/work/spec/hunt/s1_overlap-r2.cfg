\* MC_hunt_s1_overlap.cfg
\* Scenario 1 — time-limited attempts escape the attempt sequence (brief S1;
\* MC-1, MC-2, MC-8; D-1, D-2, D-3).  One caller, fixedTimeLimit(d, unit) on the
\* private cached pool (AttemptTimeLimiters.java:89-91 -> SimpleTimeLimiter.java:81-84),
\* retryIfException(), stopAfterAttempt(3), noWait.  Callables: Ret (slow, ignores
\* interrupts, may finish at the deadline), Exc, IntrRet (honours cancel's interrupt),
\* Stuck (uninterruptible, never returns).  Up to 2 deadline expiries; no interrupts.
\* Same model as MC_hunt_s1_timelimit.cfg with NoDiscardedCompletion turned off
\* (D-2 is reported by that cfg) so the run reaches the overlap and lifetime
\* properties: SequentialAttempts / NoActivityAfterOutcome (D-1; D-3 with Stuck).

