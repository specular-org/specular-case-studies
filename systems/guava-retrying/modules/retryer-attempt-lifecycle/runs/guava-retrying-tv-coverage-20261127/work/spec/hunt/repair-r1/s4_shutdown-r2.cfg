\* MC_hunt_s4_shutdown.cfg
\* Scenario 4 — a user-supplied limiter executor is shut down while calls retry
\* (brief MC-3; D-10).  One caller, fixedTimeLimit(d, unit, executor) on a cached
\* pool that the application shuts down once at any time; stopAfterAttempt(3).
\* Predicate retryIfExceptionOfType(IOException): the RejectedExecutionException from
\* submit is not retried and leaves call() as an ExecutionException.
\* Expected: CountedImpliesInvokedNoStartRace (rejected attempt counted),
\* ExecutionExceptionMeansCallableThrewExcept29 (ExecutionException although the
\* callable never ran; the #29 timeout case is excluded).

