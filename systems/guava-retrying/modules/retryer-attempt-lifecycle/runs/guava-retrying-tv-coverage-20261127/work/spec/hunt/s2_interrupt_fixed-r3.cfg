\* MC_hunt_s2_interrupt_fixed.cfg
\* Scenario 2 — caller interrupts with fixedTimeLimit (brief MC-4; D-5, and the
\* caller-interrupt trigger of D-1).  One direct caller, cached pool,
\* retryIfException(), stopAfterAttempt(2), noWait or a positive wait.  One
\* Thread.interrupt() that can land at any caller step, including before call().
\* No deadline expiries, so every un-run attempt comes from the interrupt.
\* Expected: NoRetryAfterObservedInterrupt, InterruptPreserved, CountedImpliesInvoked
\* (attempt cancelled before it ran), SequentialAttempts (Stuck/Ret attempt keeps
\* running after the interrupt).

