\* derived from MC_hunt_s2_live.cfg: CountCap raised 2 -> 3 (liveness-pattern "Check the result": bound closest to the stuck loop + 1)
\* MC_hunt_s2_live.cfg
\* Scenario 2 liveness — InterruptedCallEventuallyExits (brief section 5; D-7, D-5).
\* LiveSpec = MCSpec /\ per-thread weak fairness (MC.tla Fairness).  The caller is
\* executor.submit(retryer.wrap(callable)); the outer future is cancelled with
\* cancel(true) once, at any point (CancelOuter interrupts the thread running call()).
\* fixedTimeLimit on a cached pool, retryIfException(), neverStop, a callable that
\* always fails (Exc) and completes by itself, so deadline expiries are not needed
\* for progress and are disabled (MaxTimeouts = 0): the witness cannot rely on the
\* timing-only pattern where every attempt times out before a thread starts it.
\* Attempt counters saturate at CountCap = 2 (NextCount <- MCNextCount) so the retry
\* loop is a finite cycle.  No SYMMETRY / CONSTRAINT / VIEW.
\* Premise check: replace the PROPERTY with INVARIANT NoInterruptDeliveredInv; TLC
\* must report it violated.  Control: RetryOn = {"CallableExc"}
\* (retryIfExceptionOfType(IOException)) makes the property hold.
\* Expected: violation — the cancellation interrupt is consumed by Future.get,
\* retried as an ordinary failure, and the cancelled task retries forever.

SPECIFICATION LiveSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2}
    TaskIds = {t1, t2}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "Never"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Exc"}
    WrapCallers = {c1}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 1
    MaxTimeouts = 0
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 3
    NextCount <- MCNextCount

INVARIANT TypeOK

PROPERTY InterruptedCallEventuallyExits

CHECK_DEADLOCK FALSE
