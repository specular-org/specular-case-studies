\* ctl_s1_timelimit_revised.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s1_timelimit.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: acceptance -- the revised invariants hold on every reachable state of the RR-001 cfg, including the MC-3 counterexample path (expected: exhaustive, no violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2, w3}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Exc", "IntrRet", "Stuck"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 2
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    NoDiscardedCompletion
    CountedImpliesInvokedNoStartRace

CHECK_DEADLOCK FALSE
