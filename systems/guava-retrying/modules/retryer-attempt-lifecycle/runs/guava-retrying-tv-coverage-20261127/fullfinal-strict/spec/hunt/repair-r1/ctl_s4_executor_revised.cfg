\* ctl_s4_executor_revised.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s4_executor.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: acceptance -- the revised invariants hold on every reachable state of the RR-002 cfg, including the MC-8 counterexample paths (queued timeout, capacity rejection) (expected: exhaustive, no violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1, c2}
    Workers = {w1}
    TaskIds = {t1, t2, t3, t4}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Bounded"
    PoolSize = 1
    QueueCap = 1
    RetryOn = {"Timeout", "Rejected", "CallableExc"}
    StopKind = "AfterAttempt"
    StopAfter = 2
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Stuck"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 2
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 2
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    NoDiscardedCompletion
    CountedImpliesInvokedNoStartRace

CHECK_DEADLOCK FALSE
