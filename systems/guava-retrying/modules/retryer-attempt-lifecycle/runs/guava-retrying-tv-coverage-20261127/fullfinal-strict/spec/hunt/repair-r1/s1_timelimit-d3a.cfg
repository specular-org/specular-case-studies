\* derived from MC_hunt_s1_timelimit.cfg by hunt/derive_cfg.py --off SequentialAttempts:D-1 = MC-1 --off NoActivityAfterOutcome:D-1/D-3 = MC-1; this run isolates the Stuck case (MCHunt.tla) --on StuckBodiesEndWithCall
\* MC_hunt_s1_timelimit.cfg
\* Scenario 1 — time-limited attempts escape the attempt sequence (brief S1;
\* MC-1, MC-2, MC-8; D-1, D-2, D-3).  One caller, fixedTimeLimit(d, unit) on the
\* private cached pool (AttemptTimeLimiters.java:89-91 -> SimpleTimeLimiter.java:81-84),
\* retryIfException(), stopAfterAttempt(3), noWait.  Callables: Ret (slow, ignores
\* interrupts, may finish at the deadline), Exc, IntrRet (honours cancel's interrupt),
\* Stuck (uninterruptible, never returns).  Up to 2 deadline expiries; no interrupts.
\* Before RR-001 the first counterexample was NoDiscardedCompletion (D-2: the body
\* completes between the timeout decision and cancel's CAS).  RR-001 (MC-3) found
\* that state to be the documented timeout outcome, so the property is off here;
\* this cfg now checks the same model and properties as MC_hunt_s1_overlap.cfg.

SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2, w3}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Exc", "IntrRet", "Stuck"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 2
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    StuckBodiesEndWithCall
    \* --- type and structure ---
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    \* --- baseline, expected to hold (MC-8, MC-9) ---
    InterruptContainment
    RetryAccounting
    \* --- scenario properties ---
    \* SequentialAttempts    \* off (hunt): D-1 = MC-1
    \* NoActivityAfterOutcome    \* off (hunt): D-1/D-3 = MC-1; this run isolates the Stuck case (MCHunt.tla)
    \* NoDiscardedCompletion    \* off (RR-001): only its caller-interrupt part is a promised property, and this cfg has no caller interrupt (MaxInterrupts = 0, no outer cancel); the timeout part was removed from base.tla
    \* CountedImpliesInvoked    \* off: first violated by the timing-only start race (deadline before an idle/new thread reaches the task); CountedImpliesInvokedNoStartRace hunts the rest
    CountedImpliesInvokedNoStartRace
    ExecutionExceptionMeansCallableThrew
    \* ExecutionExceptionMeansCallableThrewExcept29    \* off: superseded here by ExecutionExceptionMeansCallableThrew (#29 cannot trigger: Timeout is retried)
    InterruptPreserved
    NoRetryAfterObservedInterrupt
    CancelledWrapperStops
    DocumentedOutcomesOnly
    NoLostAttemptOutcome
    ListenersFixedAtBuild

CHECK_DEADLOCK FALSE
