\* ctl_s4_shutdown_cir.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_s4_shutdown.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: falsifiability -- the revised CountedImpliesInvokedNoStartRace still flags a rejection by a shut-down executor counted as an attempt (MC-9) (expected: violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2, w3}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 0
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"CallableExc"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Exc"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 0
    MaxOuterCancels = 0
    MaxTimeouts = 1
    TimeoutsBounded = TRUE
    MaxShutdowns = 1
    MaxIdleExits = 1
    MaxAddListeners = 0
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    CountedImpliesInvokedNoStartRace

CHECK_DEADLOCK FALSE
