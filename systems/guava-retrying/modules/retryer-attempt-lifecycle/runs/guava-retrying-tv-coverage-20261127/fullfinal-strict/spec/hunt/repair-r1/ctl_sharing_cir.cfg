\* ctl_sharing_cir.cfg -- repair round 1 (RR-001/RR-002) control derived from MC_hunt_sharing.cfg:
\* same SPECIFICATION/CONSTANTS/CONSTRAINT/SYMMETRY; INVARIANTS replaced by the list below.
\* Purpose: falsifiability -- the revised CountedImpliesInvokedNoStartRace still flags an attempt cancelled before it ran because of a caller interrupt (D-5, MC-4) (expected: violation).
SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1, c2}
    Workers = {w1, w2, w3, w4}
    TaskIds = {t1, t2, t3, t4}
    NumInitListeners = 1
    NumExtraListeners = 1
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 3
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 2
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Exc"}
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 1
    MaxOuterCancels = 0
    MaxTimeouts = 1
    TimeoutsBounded = TRUE
    MaxShutdowns = 0
    MaxIdleExits = 0
    MaxAddListeners = 1
    MaxAttempts = 2
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    TypeOK
    StructuralOK
    MCModelBoundsAdequate
    InterruptContainment
    RetryAccounting
    CountedImpliesInvokedNoStartRace

CHECK_DEADLOCK FALSE
