\* base.cfg — standalone check of base.tla (no MC counters).
\* One caller, fixedTimeLimit on a cached pool, stopAfterAttempt(2).
\* Environment actions are naturally bounded here (interrupt flags are
\* booleans, ExtraListeners is finite, attempts stop at StopAfter).

SPECIFICATION Spec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2}
    TaskIds = {t1, t2}
    InitListeners = <<"L1">>
    ExtraListeners = {"L2"}
    Limiter = "Fixed"
    ExecKind = "Cached"
    PoolSize = 2
    QueueCap = 0
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 2
    SleepClasses = {"Zero"}
    Modes = {"Ret", "Exc", "IntrBlock"}
    JDK8Order = FALSE
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller

INVARIANTS
    TypeOK
    StructuralOK
    ModelBoundsAdequate
    RetryAccounting
    InterruptContainment

CHECK_DEADLOCK FALSE
