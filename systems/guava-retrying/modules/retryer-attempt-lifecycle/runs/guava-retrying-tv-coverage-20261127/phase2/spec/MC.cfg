\* MC.cfg — standard configuration for spec validation (convergence).
\* One caller on fixedTimeLimit(d, unit, executor) with a bounded executor
\* (1 thread, queue of 1, AbortPolicy) so that every executor path is
\* exercised: new thread, queueing, rejection, shutdown, thread reuse,
\* cancellation of queued and running tasks.  Interrupts, timeouts and a
\* post-build listener are enabled with small budgets.
\* Standard and structural invariants are on; the scenario invariants are
\* listed but commented out (they are enabled in the MC_hunt_*.cfg files).

SPECIFICATION MCSpec

CONSTANTS
    Callers = {c1}
    Workers = {w1, w2}
    TaskIds = {t1, t2, t3}
    NumInitListeners = 1
    NumExtraListeners = 1
    Limiter = "Fixed"
    ExecKind = "Bounded"
    PoolSize = 1
    QueueCap = 1
    RetryOn = {"Timeout", "CallerIE", "CallableExc", "CallableIE", "Rejected"}
    StopKind = "AfterAttempt"
    StopAfter = 3
    SleepClasses = {"Zero", "Positive"}
    Modes = {"Ret", "Exc", "IntrRet", "Stuck"}
    JDK8Order = FALSE
    WrapCallers = {}
    WrapOnLimiterPool = {}
    NoTask = NoTask
    NoWorker = NoWorker
    NoCaller = NoCaller
    MaxInterrupts = 1
    MaxOuterCancels = 0
    MaxTimeouts = 2
    TimeoutsBounded = TRUE
    MaxShutdowns = 1
    MaxIdleExits = 0
    MaxAddListeners = 1
    MaxAttempts = 3
    CountCap = 100

CONSTRAINT StateConstraint
SYMMETRY Perms

INVARIANTS
    \* --- type and structure ---
    TypeOK
    StructuralOK
    ModelBoundsAdequate
    \* --- baseline properties expected to hold (brief MC-8, MC-9) ---
    InterruptContainment
    RetryAccounting

\* --- scenario properties (enabled in MC_hunt_*.cfg) ---
\* INVARIANT SequentialAttempts
\* INVARIANT NoActivityAfterOutcome
\* INVARIANT NoDiscardedCompletion
\* INVARIANT CountedImpliesInvoked
\* INVARIANT CountedImpliesInvokedNoStartRace
\* INVARIANT ExecutionExceptionMeansCallableThrew
\* INVARIANT ExecutionExceptionMeansCallableThrewExcept29
\* INVARIANT InterruptPreserved
\* INVARIANT NoRetryAfterObservedInterrupt
\* INVARIANT CancelledWrapperStops
\* INVARIANT DocumentedOutcomesOnly
\* INVARIANT NoLostAttemptOutcome
\* INVARIANT ListenersFixedAtBuild

CHECK_DEADLOCK FALSE
